plugins {
    id 'fabric-loom' version '1.16-SNAPSHOT'
    id 'maven-publish'
}

// ---------------------------------------------------------------------------
// Stonecutter version template. Evaluated once per registered node.
// Per-node values (minecraft_version, sodium_dep, ...) come from
// versions/<node>/gradle.properties; shared values from root gradle.properties.
// ---------------------------------------------------------------------------

def mcVersion = stonecutter.current.version

def gitCommitHash = { ->
    try {
        def result = providers.exec {
            commandLine = ['git', 'rev-parse', '--short', 'HEAD']
            ignoreExitValue = true
        }
        if (result.result.get().exitValue != 0) {
            return "<UnknownCommit>"
        }
        return result.standardOutput.asText.get().strip()
    } catch (Exception ignored) {
        return "<UnknownCommit>"
    }
}
def buildtime = System.currentTimeSeconds()

version = project.mod_version
group = project.maven_group

def javaVer = (project.findProperty('java_version') ?: '21') as int

java {
    sourceCompatibility = JavaVersion.toVersion(javaVer)
    targetCompatibility = JavaVersion.toVersion(javaVer)
}

apply plugin: "fabric-loom"

loom {
    runs {
        it.configureEach {
            vmArgs("-Xmx8G")
        }
    }
    // Older generations ship an access widener; newer ones don't.
    def aw = file("src/main/resources/nvidium.accesswidener")
    if (aw.exists()) {
        accessWidenerPath = aw
    }
}

base {
    archivesName = "nvidium"
}

processResources {
    def v = project.version
    // fabric.mod.json carries placeholders that vary per node.
    def modJsonProps = [
            "commit"        : gitCommitHash(),
            "version"       : v,
            "buildtime"     : buildtime,
            "mc_depend"     : project.mc_depend,
            "sodium_depend" : project.sodium_depend,
            "loader_depends": project.findProperty('loader_depends') ?: '>=0.15'
    ]
    inputs.properties(modJsonProps)
    filesMatching("fabric.mod.json") {
        expand(modJsonProps)
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        name = "CaffeineMC"
        url = "https://maven.caffeinemc.net/releases"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Mojmap (+ Parchment param names where available) across all versions.
    mappings loom.layered() {
        officialMojangMappings()
        if (project.hasProperty('parchmentmc_mappings') && !project.parchmentmc_mappings.toString().isBlank()) {
            parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${project.parchmentmc_mappings}@zip")
        }
    }

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // --- Fabric API ---
    // The individual module names drift across MC versions (block-view -> block-getter,
    // renderer-api added then dropped, etc). Depending on the full bundle for *compilation*
    // sidesteps all of that; actual runtime requirements are declared in fabric.mod.json.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // --- Sodium (coordinate shape differs by generation) ---
    //   G0.4-G0.7: single Modrinth artifact (maven.modrinth:sodium:...)
    //   G0.8:      split CaffeineMC artifacts (sodium-fabric + sodium-fabric-api)
    modImplementation(project.sodium_dep.toString())
    if (project.hasProperty('sodium_api_dep') && !project.sodium_api_dep.toString().isBlank()) {
        modImplementation(project.sodium_api_dep.toString())
    }

    // --- Iris (compile-only soft dependency) ---
    if (project.hasProperty('iris_dep') && !project.iris_dep.toString().isBlank()) {
        modCompileOnly(project.iris_dep.toString())
    }
}
