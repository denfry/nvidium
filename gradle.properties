# Shared across all Stonecutter nodes. Per-version values live in
# versions/<node>/gradle.properties (minecraft/sodium/iris/fabric/loader/java).
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.caching=true
# parallel / configuration-cache left off for now: fabric-loom is not reliably
# compatible with them while configuring many version nodes. Revisit once stable.

# Acknowledge Stonecutter's "use Kotlin DSL" advice (we intentionally use Groovy).
dev.kikugie.stonecutter.hard_mode=true

# Mod identity
maven_group=me.cortex
archives_base_name=nvidium
