name: Build

on:
  push:
    branches: [ dev, multiversion ]
  pull_request:
    branches: [ dev, multiversion ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle/Stonecutter must run on JDK 21+ (Stonecutter 0.9.6 requires it).
      # The 1.20.1 node still compiles to Java 17 bytecode via build.gradle's
      # sourceCompatibility/targetCompatibility, so 21 here is the runtime, not the target.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: nvidium-dev-build
          path: |
            versions/**/build/libs/*.jar
            !versions/**/build/libs/*-dev.jar
            !versions/**/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
