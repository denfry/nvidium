name: Build

on:
  push:
    branches: [ dev, multiversion ]
  pull_request:
    branches: [ dev, multiversion ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The active Stonecutter node (1.20.1) targets Java 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: nvidium-dev-build
          path: |
            versions/**/build/libs/*.jar
            !versions/**/build/libs/*-dev.jar
            !versions/**/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
