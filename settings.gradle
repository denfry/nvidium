pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'KikuGie Releases'
            url = 'https://maven.kikugie.dev/releases'
        }
        maven {
            name = 'KikuGie Snapshots'
            url = 'https://maven.kikugie.dev/snapshots'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.6'
}

stonecutter {
    // Stonecutter defaults to a Kotlin controller; this project uses Groovy.
    kotlinController = false
    centralScript = "build.gradle"

    // One node per Sodium-API generation (see versions/<node>/gradle.properties):
    //   1.20.1  -> Sodium 0.4.10 (G0.4)
    //   1.21    -> Sodium 0.5.11 (G0.5)
    //   1.21.6  -> Sodium 0.6.13 (G0.6)
    //   1.21.10 -> Sodium 0.7.2  (G0.7)
    //   1.21.11 -> Sodium 0.8.12 (G0.8)
    //   26.1.2  -> Sodium 0.8.12 (G0.8, Java 25 / MC 26.x)
    // FOCUS: only 1.20.1 is registered right now (user decision — perfect 1.20.1
    // first, add the rest later). The other nodes' versions/<node>/gradle.properties
    // are kept; re-add them here when resuming multi-version work:
    //   "1.21" (G0.5) · "1.21.6" (G0.6) · "1.21.10" (G0.7) · "1.21.11" (G0.8)
    //   "26.1.2" (G0.8) — also needs a JDK 25 toolchain.
    create(rootProject) {
        versions "1.20.1"
        vcsVersion = "1.20.1"
    }
}
